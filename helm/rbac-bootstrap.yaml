# Deliberately kept OUTSIDE helm/templates/ so a plain `helm upgrade`/`helm lint` never
# needs RBAC-management permissions - apply this once, out-of-band, with an account that
# has them:
#   oc apply -f helm/rbac-bootstrap.yaml -n ppm-cpe-qa
#   oc get rolebinding myrelease-helm-rolebinding -n ppm-cpe-qa
#
# helm/templates/role.yaml and rolebinding.yaml offer an alternative, in-chart version of
# this same Role/RoleBinding, gated behind values.yaml's `rbac.create` (default false).
# Only flip that to true if the account running helm has RBAC-management rights in this
# namespace and you'd rather Helm own these objects instead of managing them here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myrelease-helm-role
  namespace: ppm-cpe-qa
  labels:
    helm.sh/chart: helm-0.1.0
    app.kubernetes.io/name: helm
    app.kubernetes.io/instance: myrelease
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myrelease-helm-rolebinding
  namespace: ppm-cpe-qa
  labels:
    helm.sh/chart: helm-0.1.0
    app.kubernetes.io/name: helm
    app.kubernetes.io/instance: myrelease
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: myrelease-helm
    namespace: ppm-cpe-qa
roleRef:
  kind: Role
  name: myrelease-helm-role
  apiGroup: rbac.authorization.k8s.io
