apiVersion: v1
kind: Service
metadata:
  name: nucleus-rule-services
  labels:
    {{- include "cpe.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    cluster: nucleus-rule-services
  ports:
    - name: akka-4051
      port: {{ .Values.akkaOptions.remoteOptions.port | default 4051 }}
      targetPort: {{ .Values.akkaOptions.remoteOptions.port | default 4051 }}
      protocol: TCP
    - name: management
      port: 8558
      targetPort: 8558
      protocol: TCP
