{{- range $svcName, $svc := .Values.services }}
  {{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "cpe.fullname" $) $svcName }}
  labels:
    app: {{ printf "%s-%s" (include "cpe.fullname" $) $svcName }}
    {{- include "cpe.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .headless }}
  clusterIP: None # Headless service
  {{- end }}
  selector:
    app: {{ printf "%s-%s" (include "cpe.fullname" $) $svcName }}
  ports:
    {{- range $portName, $port := $svc.ports }}
    - name: {{ $portName }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
    {{- end }}
---
{{- end }}
  {{- end }}