{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cpe.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cpe.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cpe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "cpe.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
