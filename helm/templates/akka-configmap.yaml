apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpe.fullname" . }}-akka-conf
data:
  akka.hocon: |
    akka {
      actor.provider = cluster
      # INFO (not DEBUG) - cluster.log-info = on below already surfaces discovery/join/member-up
      # events at INFO level; DEBUG adds so much DNS/actor-internal noise that those events get buried
      # and truncated out of any reasonably-sized log capture.
      loglevel = INFO
      stdout-loglevel = INFO

      remote.dot-netty.tcp {
        hostname = "0.0.0.0"
        port = {{ .Values.akkaOptions.remoteOptions.port | default 4051 }}
      }

      io.dns {
        resolver = async-dns
        async-dns {
          class = "Akka.Discovery.Dns.Internal.DnsClient, Akka.Discovery.Dns"
          provider-object = "Akka.Discovery.Dns.Internal.AsyncDnsProvider, Akka.Discovery.Dns"
          nameservers = []
          cache-cleanup-interval = 120s
          positive-ttl = forever
        }
      }

      # How to tell which discovery method actually resolved contact points (no built-in
      # "method used" log line exists at INFO level - confirmed by inspecting Akka.Discovery.dll
      # directly; the only per-method messages are logged below INFO): check the ResolvedTarget
      # address FORMAT in the "Located service members" log line -
      #   kubernetes-api -> raw dotted IP, e.g. ResolvedTarget(172.23.5.127, 8558, 172.23.5.127)
      #     (because use-raw-ip = true below)
      #   akka-dns       -> DNS hostname, e.g. ResolvedTarget(172-23-5-128.<svc>.<ns>.svc.cluster.local, 8558, ...)
      # Empirically verified by forcing kubernetes-api to return empty (bad pod-label-selector)
      # and observing the format flip from raw IP to hostname in the same log line.
      discovery {
        method = aggregate
        aggregate.discovery-methods = [kubernetes-api, akka-dns, config]

        akka-dns {
          class = "Akka.Discovery.Dns.DnsServiceDiscovery, Akka.Discovery.Dns"
          resolve-timeout = 5s
          verbose-failure-logging = on
        }

        kubernetes-api {
          class = "Akka.Discovery.KubernetesApi.KubernetesApiServiceDiscovery, Akka.Discovery.KubernetesApi"
          api-ca-path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          api-token-path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          api-service-host-env-name = "KUBERNETES_SERVICE_HOST"
          api-service-port-env-name = "KUBERNETES_SERVICE_PORT"
          pod-namespace-path = "/var/run/secrets/kubernetes.io/serviceaccount/namespace"
          pod-namespace = "{{ .Release.Namespace }}"
          pod-domain = "cluster.local"
          pod-label-selector = "cluster=nucleus-rule-services"
          use-raw-ip = true
          container-name = ""
        }

        config {
          class = "Akka.Discovery.Config.ConfigServiceDiscovery, Akka.Discovery"
          services {}
        }
      }

      # cluster.bootstrap.contact-point-discovery is deliberately NOT set here - WithClusterBootstrap(...)
      # in Program.cs passes service-name/service-namespace/port-name/required-contact-point-nr
      # explicitly, via a strongly-typed Setup object that takes priority over HOCON regardless of what's
      # set here (that value comes from the AkkaOptions__ClusterOptions__RequiredContactPointNr env var
      # instead, set in deployment.yaml from the same .Values.akkaOptions.clusterOptions.requiredContactPointNr).

      cluster {
        log-info = on
        downing-provider-class = "Akka.Cluster.SBR.SplitBrainResolverProvider, Akka.Cluster"
        split-brain-resolver {
          active-strategy = keep-majority
          stable-after = 20s
          down-all-when-unstable = on
        }
      }
    }

    petabridge.cmd {
      host = "0.0.0.0"
      port = 9110
      log-info = on
    }
