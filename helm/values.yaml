# Default values for cpe.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: artifactory.cotiviti.com/adlm-sandbox-docker/sandbox/poc
  tag: prod1

secrets:
  - name: secrets
    enabled: true
    data: {}

appsettings:
  Logging__LogLevel__Default: "Information"
  RedisConfiguration__PoolSize: "2"
  RedisConfiguration__Hosts__0__Host: "w1q01-cpered01.mediconnect.net"
  RedisConfiguration__Hosts__0__Port: "6379"
  RedisConfiguration__Hosts__1__Host: "w1q01-cpered01.mediconnect.net"
  RedisConfiguration__Hosts__1__Port: "6380"
  RedisConfiguration__Password: "ubYFiiG1DjO4"
  Logging__LogLevel__Microsoft: "Information"
  ApplicationSettings__SupportEmail: "cpe_dev@cotiviti.com"
  ApplicationSettings__KibanaCorrelationIdUrl: ""
  ApplicationSettings__AesKey: "496F3491AA7B8CE9AAD8BE64A72BBDC4"

  # BatchProcessor specific
  ApplicationSettings__DispatcherChunkSize: "80"
  ApplicationSettings__RecurringMessageInterval: "60"
  ApplicationSettings__PgpKeyLocation: ""
  ApplicationSettings__PgpInternalEncryptFingerprint: ""
  ApplicationSettings__ReturnFilePickupLocation: ""

  # BatchPortal specific
  ApplicationSettings__AllowBatchSeqInput: "true"
  ASPNETCORE_URLS: http://*:8080
  ASPNETCORE_HTTP_PORT: "8080"

akkaOptions:
  remoteOptions:
    port: 4051
  clusterOptions:
    # How many contact points Cluster Bootstrap must discover before it'll join/form a cluster.
    # 3 matches the 3 services (batchportal, batchprocessor, editorservice) expected to cluster together.
    requiredContactPointNr: 3

services:
  batchportal:
    enabled: true
    ports:
      akka: 4051
      pbm: 9110
      http: 8080
  editorservice:
    enabled: true
    ports:
      akka: 4051
      pbm: 9110
  batchprocessor:
    enabled: true
    ports:
      akka: 4051
      pbm: 9110

service:
  type: ClusterIP
  port: 8080

deployments:
  - name: batchportal
    enabled: true
    replicaCount: 1
    akkaRole: "batchportal"
    ports:
      pbm: 9110
      http: 8080
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  - name: editorservice
    enabled: true
    replicaCount: 1
    akkaRole: "editorservice"
    ports:
      pbm: 9110
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  - name: batchprocessor
    enabled: true
    replicaCount: 1
    akkaRole: "batchprocessor"
    ports:
      pbm: 9110
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

route:
  enabled: true
  hostname: apps.openshift-nonprod.cotiviti.com
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  routes:
    - name: batchportal
      host: cpe-batch-portal

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
  
# RBAC (Role/RoleBinding for kubernetes-api discovery) is NOT managed by this chart by
# default. helm upgrade/install runs with whatever permissions the deploying account has,
# and creating/updating RBAC objects requires RBAC-management rights that account may not
# have - if it doesn't, this would fail with 403 and block the entire release, not just RBAC.
# The default, always-safe path is helm/rbac-bootstrap.yaml, applied once out-of-band by an
# account that does have those rights (see that file's header for the exact commands).
# Only set create: true here if the account running helm has been granted RBAC-management
# permissions in this namespace and you want Helm to own the Role/RoleBinding instead.
rbac:
  create: false


podAnnotations: {}
podLabels: {}

podSecurityContext: {}
resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80


